<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Habit Tracker</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="darkreader-lock">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F4F3EF">
<style>
  html,body{margin:0;height:100%;background:#F4F3EF;color:#14161A;
    font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{height:100%;display:grid;place-content:center;text-align:center;padding:24px;gap:10px}
  .wm{font-weight:600;letter-spacing:.02em;font-size:17px}
  .m{color:#5C6068;max-width:34ch}
  a{color:#B0161C}
</style>
</head>
<body>
<main>
  <div class="wm">Habit&nbsp;Tracker</div>
  <div class="m">The app moved up one level. Taking you there&hellip;</div>
  <div class="m"><a id="go" href="../">Open the app</a></div>
</main>
<script>
/* HT-8 STUB — the app was promoted from /v3/ to the repo root.
   One job, and the order matters: unregister ONLY the worker whose scope is THIS directory, so an
   installed phone stops being served the old shell, then go up one level. The root worker must
   survive. Caches are per-ORIGIN: the root worker's activate handler already evicts every cache but
   its own, so this page deletes nothing. */
(async function(){
  var SCOPE = new URL('./', location.href).href;
  try {
    if (navigator.serviceWorker) {
      var regs = await navigator.serviceWorker.getRegistrations();
      for (var i=0;i<regs.length;i++){ if (regs[i].scope === SCOPE) { await regs[i].unregister(); } }
    }
  } catch(e){}
  location.replace('../');
})();
</script>
</body>
</html>
